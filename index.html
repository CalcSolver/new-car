<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Racing Game</title>
  <style>
    body {
      margin: 0;
      background: #181818;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    #ui {
      display: flex;
      gap: 20px;
      margin-bottom: 10px;
      align-items: center;
    }
    input, button {
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 4px;
      border: none;
    }
    input { background: #333; color: #fff; }
    button { background: #28a745; color: #fff; cursor: pointer; font-weight: bold; }
    canvas {
      border: 3px solid #444;
      background: #2ed573;
      border-radius: 8px;
    }
    .hud { font-size: 18px; font-weight: bold; }
  </style>
</head>
<body>

  <div id="ui">
    <input type="text" id="roomInput" placeholder="Room Code" value="ROOM1">
    <button id="joinBtn">Join Room</button>
    <div class="hud">Lap: <span id="lapDisplay">0/3</span></div>
    <div class="hud">Time: <span id="timeDisplay">0.0s</span></div>
  </div>

  <canvas id="gameCanvas" width="800" height="500"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const joinBtn = document.getElementById('joinBtn');
    const roomInput = document.getElementById('roomInput');
    const lapDisplay = document.getElementById('lapDisplay');
    const timeDisplay = document.getElementById('timeDisplay');

    // Game State
    let connected = false;
    let lap = 0;
    const maxLaps = 3;
    let startTime = 0;
    let elapsedTime = 0;
    let crossCooldown = false;

    // Car Object with Driving Physics
    const car = {
      x: 400,
      y: 430,
      angle: 0,
      speed: 0,
      maxSpeed: 4.5,
      accel: 0.15,
      friction: 0.96,
      turnSpeed: 0.05,
      width: 24,
      height: 12
    };

    // Track Outer & Inner Boundaries (Simple Ring Track)
    const trackOuter = { x: 50, y: 50, w: 700, h: 400, radius: 40 };
    const trackInner = { x: 200, y: 150, w: 400, h: 200, radius: 20 };

    // Keyboard Input
    const keys = {};
    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);

    joinBtn.addEventListener('click', () => {
      connected = true;
      joinBtn.innerText = 'Connected: ' + roomInput.value.toUpperCase();
      joinBtn.style.background = '#007bff';
      resetRace();
    });

    function resetRace() {
      car.x = 400;
      car.y = 430;
      car.angle = 0;
      car.speed = 0;
      lap = 0;
      startTime = Date.now();
      crossCooldown = false;
    }

    function drawStartLine(x, y, w, h) {
      const size = 8;
      for (let r = 0; r < h / size; r++) {
        for (let c = 0; c < w / size; c++) {
          ctx.fillStyle = (r + c) % 2 === 0 ? '#ffffff' : '#000000';
          ctx.fillRect(x + c * size, y + r * size, size, size);
        }
      }
    }

    function update() {
      if (!connected) return;

      // Acceleration & Friction
      if (keys['ArrowUp'] || keys['w']) car.speed = Math.min(car.speed + car.accel, car.maxSpeed);
      else if (keys['ArrowDown'] || keys['s']) car.speed = Math.max(car.speed - car.accel, -car.maxSpeed / 2);
      else car.speed *= car.friction;

      // Steering
      if (Math.abs(car.speed) > 0.1) {
        const dir = car.speed > 0 ? 1 : -1;
        if (keys['ArrowLeft'] || keys['a']) car.angle -= car.turnSpeed * dir;
        if (keys['ArrowRight'] || keys['d']) car.angle += car.turnSpeed * dir;
      }

      // Position Update
      car.x += Math.cos(car.angle) * car.speed;
      car.y += Math.sin(car.angle) * car.speed;

      // Lap Detection (Crossing x = 400 at bottom straight)
      if (car.y > 350 && car.x >= 395 && car.x <= 405 && !crossCooldown) {
        if (car.speed > 0) {
          lap++;
          crossCooldown = true;
          setTimeout(() => crossCooldown = false, 2000);
        }
      }

      // Timer
      if (lap > 0 && lap <= maxLaps) {
        elapsedTime = ((Date.now() - startTime) / 1000).toFixed(1);
      }

      lapDisplay.innerText = `${Math.min(lap, maxLaps)}/${maxLaps}`;
      timeDisplay.innerText = `${elapsedTime}s`;
    }

    function render() {
      // Grass Background
      ctx.fillStyle = '#2ed573';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Asphalt Track
      ctx.fillStyle = '#57606f';
      ctx.beginPath();
      ctx.roundRect(trackOuter.x, trackOuter.y, trackOuter.w, trackOuter.h, trackOuter.radius);
      ctx.fill();

      // Grass Infield
      ctx.fillStyle = '#2ed573';
      ctx.beginPath();
      ctx.roundRect(trackInner.x, trackInner.y, trackInner.w, trackInner.h, trackInner.radius);
      ctx.fill();

      // Checkered Start/Finish Line
      drawStartLine(396, 350, 8, 100);

      // Render Player Car
      ctx.save();
      ctx.translate(car.x, car.y);
      ctx.rotate(car.angle);
      ctx.fillStyle = '#ff4757';
      ctx.fillRect(-car.width / 2, -car.height / 2, car.width, car.height);
      ctx.fillStyle = '#1e90ff'; // Windshield
      ctx.fillRect(2, -car.height / 3, 6, car.height * 0.66);
      ctx.restore();
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
