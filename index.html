<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Racing Game</title>
  <style>
    body {
      margin: 0;
      background: #1e1e1e;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #lobby {
      margin-bottom: 12px;
    }
    input, button {
      padding: 10px 14px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      outline: none;
    }
    input {
      background: #333;
      color: #fff;
      margin-right: 6px;
    }
    button {
      background: #28a745;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #218838;
    }
    canvas {
      border: 4px solid #444;
      background: #333;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div id="lobby">
    <input type="text" id="roomInput" placeholder="Enter Room Code" value="ROOM1">
    <button id="joinBtn">Play</button>
  </div>

  <canvas id="gameCanvas" width="800" height="400"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const joinBtn = document.getElementById('joinBtn');
    const roomInput = document.getElementById('roomInput');

    let isConnected = false;
    let currentRoom = '';

    // Player Object
    const player = {
      x: 50,
      y: 180,
      width: 40,
      height: 20,
      speed: 4,
      color: '#ff4757'
    };

    // Keyboard Controls
    const keys = {};
    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);

    // Simplified Direct Join Logic
    joinBtn.addEventListener('click', () => {
      const roomCode = roomInput.value.trim().toUpperCase();
      if (!roomCode) return;

      currentRoom = roomCode;
      isConnected = true;
      joinBtn.innerText = 'Connected: ' + currentRoom;
      joinBtn.style.background = '#007bff';
    });

    // Draw Checkered Start Line
    function drawStartLine(x, y, width, height, tileSize) {
      const rows = height / tileSize;
      const cols = width / tileSize;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          ctx.fillStyle = (r + c) % 2 === 0 ? '#ffffff' : '#000000';
          ctx.fillRect(x + c * tileSize, y + r * tileSize, tileSize, tileSize);
        }
      }
    }

    // Main Game Loop
    function update() {
      if (isConnected) {
        if (keys['ArrowRight'] || keys['d']) player.x += player.speed;
        if (keys['ArrowLeft'] || keys['a']) player.x -= player.speed;
        if (keys['ArrowUp'] || keys['w']) player.y -= player.speed;
        if (keys['ArrowDown'] || keys['s']) player.y += player.speed;
      }
    }

    function render() {
      // Clear Screen
      ctx.fillStyle = '#2ed573'; // Grass
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Track Area
      ctx.fillStyle = '#57606f';
      ctx.fillRect(0, 100, canvas.width, 200);

      // Render Checkered Start/Finish Line at x = 120
      drawStartLine(120, 100, 20, 200, 10);

      // Render Player Car
      ctx.fillStyle = player.color;
      ctx.fillRect(player.x, player.y, player.width, player.height);
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
