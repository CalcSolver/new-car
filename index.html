<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Racing Game!</title>
  
  <!-- Classic Fonts -->
  <link href="https://fonts.googleapis.com/css?family=Monoton|Press+Start+2P" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Press Start 2P', monospace;
      color: #fff;
    }

    /* Original Overlay Menu Styling */
    #fore {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }
    #version {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 10px;
      color: #888;
    }
    .title {
      font-family: 'Monoton', cursive;
      font-size: 42px;
      color: #ff3366;
      text-shadow: 0 0 10px #ff3366;
      text-align: center;
    }
    .menuitem {
      font-size: 12px;
      text-align: center;
      line-height: 24px;
    }
    input#name {
      margin-top: 8px;
      padding: 10px;
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      background: #222;
      color: #fff;
      border: 2px solid #ff3366;
      border-radius: 4px;
      text-align: center;
      outline: none;
    }
    #colorpicker {
      width: 240px;
      height: 24px;
      margin-top: 8px;
      background: linear-gradient(to right, 
        hsl(0,100%,50%), hsl(60,100%,50%), hsl(120,100%,50%), 
        hsl(180,100%,50%), hsl(240,100%,50%), hsl(300,100%,50%), hsl(360,100%,50%));
      border: 2px solid #fff;
      position: relative;
      cursor: pointer;
      border-radius: 4px;
    }
    #slider {
      width: 6px;
      height: 100%;
      background: #fff;
      border: 1px solid #000;
      position: absolute;
      top: 0;
      left: 0;
    }
    #start {
      margin-top: 10px;
      padding: 12px 24px;
      background: #28a745;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      font-size: 16px;
      cursor: pointer;
      border: 2px solid #fff;
      border-radius: 4px;
      box-shadow: 0 4px 0 #1e7e34;
    }
    #start:active {
      transform: translateY(4px);
      box-shadow: none;
    }

    /* In-Game HUD */
    #hud {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 10;
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    .hud-element {
      background: rgba(0, 0, 0, 0.75);
      padding: 10px 14px;
      border: 2px solid #ff3366;
      font-size: 11px;
      color: #fff;
      border-radius: 4px;
    }

    #canvas3d {
      width: 100vw;
      height: 100vh;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Classic Menu Overlay -->
  <div id="fore">
    <div id="version">v1.1.3.14</div>
    <div class="title" id="title">Online Racing Game!</div>
    
    <div class="menuitem">
      Pick a name:<br/>
      <input id="name" placeholder="Name" value="Player1" maxlength="12">
    </div>

    <div class="menuitem">
      Choose a color:<br/>
      <div id="colorpicker">
        <div id="slider"></div>
      </div>
    </div>

    <div class="menuitem">
      <div id="start">Start!</div>
    </div>
  </div>

  <!-- HUD overlay during gameplay -->
  <div id="hud">
    <div class="hud-element" id="playerTag">PLAYER: Player1</div>
    <div class="hud-element" id="lapHud">LAP: 1 / 10</div>
    <div class="hud-element" id="speedHud">SPEED: 0 KM/H</div>
  </div>

  <canvas id="canvas3d"></canvas>

  <script>
    // --- COLOR PICKER SYSTEM ---
    let selectedHue = 0;
    const picker = document.getElementById('colorpicker');
    const slider = document.getElementById('slider');

    function setPickerColor(e) {
      const rect = picker.getBoundingClientRect();
      let x = e.clientX - rect.left;
      x = Math.max(0, Math.min(rect.width, x));
      selectedHue = Math.floor((x / rect.width) * 360);
      slider.style.left = (x - 3) + 'px';
      if (carMaterial) {
        carMaterial.color.setHSL(selectedHue / 360, 0.8, 0.5);
      }
    }

    let isDragging = false;
    picker.addEventListener('mousedown', (e) => { isDragging = true; setPickerColor(e); });
    window.addEventListener('mousemove', (e) => { if (isDragging) setPickerColor(e); });
    window.addEventListener('mouseup', () => { isDragging = false; });

    // --- THREE.JS SCENE SETUP ---
    const canvas = document.getElementById('canvas3d');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x70c5ce);
    scene.fog = new THREE.Fog(0x70c5ce, 100, 450);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

    // Ambient & Directional Lights
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const sun = new THREE.DirectionalLight(0xffffff, 0.8);
    sun.position.set(100, 200, 100);
    sun.castShadow = true;
    scene.add(sun);

    // Ground Grass
    const groundGeo = new THREE.PlaneGeometry(800, 800);
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x27ae60 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // --- EXPANDED LONG TRACK (OVAL TRACK) ---
    // Increased outer and inner radii for a significantly longer lap length
    const R_OUTER = 140;
    const R_INNER = 95;
    const TRACK_WIDTH = R_OUTER - R_INNER;

    const trackGeo = new THREE.RingGeometry(R_INNER, R_OUTER, 128);
    const trackMat = new THREE.MeshLambertMaterial({ color: 0x34495e, side: THREE.DoubleSide });
    const track = new THREE.Mesh(trackGeo, trackMat);
    track.rotation.x = -Math.PI / 2;
    track.position.y = 0.02;
    scene.add(track);

    // --- CHECKERED START / FINISH LINE ---
    function drawCheckeredStartLine() {
      const lineGroup = new THREE.Group();
      const rows = 2;
      const cols = 12;
      const size = TRACK_WIDTH / cols;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const isWhite = (r + c) % 2 === 0;
          const mat = new THREE.MeshBasicMaterial({ color: isWhite ? 0xffffff : 0x000000 });
          const geo = new THREE.PlaneGeometry(size, 3);
          const tile = new THREE.Mesh(geo, mat);
          tile.rotation.x = -Math.PI / 2;
          tile.position.set(R_INNER + (c * size) + (size / 2), 0.03, (r * 3) - 1.5);
          lineGroup.add(tile);
        }
      }
      return lineGroup;
    }
    scene.add(drawCheckeredStartLine());

    // --- CAR CREATION ---
    const carGroup = new THREE.Group();
    const carMaterial = new THREE.MeshStandardMaterial({ color: 0xff0000 });
    
    // Chassis
    const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.8, 4.2), carMaterial);
    body.position.y = 0.6;
    carGroup.add(body);

    // Roof
    const cabin = new THREE.Mesh(
      new THREE.BoxGeometry(1.8, 0.6, 2.2), 
      new THREE.MeshStandardMaterial({ color: 0x111111 })
    );
    cabin.position.set(0, 1.2, -0.2);
    carGroup.add(cabin);

    scene.add(carGroup);
    carGroup.position.set((R_OUTER + R_INNER) / 2, 0, 10);

    // --- PHYSICS & CAR STATE ---
    const carState = {
      speed: 0,
      maxSpeed: 1.1,
      accel: 0.025,
      friction: 0.97,
      turnSpeed: 0.032,
      angle: 0,
      lap: 1,
      maxLaps: 10,
      crossedLine: false,
      gameStarted: false
    };

    const keys = {};
    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    // --- START GAME ---
    document.getElementById('start').addEventListener('click', () => {
      const pName = document.getElementById('name').value.trim() || 'Player1';
      document.getElementById('playerTag').innerText = `PLAYER: ${pName.toUpperCase()}`;
      document.getElementById('fore').style.display = 'none';
      document.getElementById('hud').style.display = 'flex';
      carState.gameStarted = true;
    });

    // --- SLIDING WALL PHYSICS ---
    function applyWallCollisions() {
      const distFromCenter = Math.hypot(carGroup.position.x, carGroup.position.z);
      const carPadding = 1.5;

      if (distFromCenter + carPadding > R_OUTER) {
        const angle = Math.atan2(carGroup.position.z, carGroup.position.x);
        carGroup.position.x = Math.cos(angle) * (R_OUTER - carPadding);
        carGroup.position.z = Math.sin(angle) * (R_OUTER - carPadding);
        carState.speed *= 0.75;
      }

      if (distFromCenter - carPadding < R_INNER) {
        const angle = Math.atan2(carGroup.position.z, carGroup.position.x);
        carGroup.position.x = Math.cos(angle) * (R_INNER + carPadding);
        carGroup.position.z = Math.sin(angle) * (R_INNER + carPadding);
        carState.speed *= 0.75;
      }
    }

    // --- ANIMATION LOOP ---
    function animate() {
      requestAnimationFrame(animate);

      if (carState.gameStarted) {
        // Drive controls
        if (keys['w'] || keys['arrowup']) carState.speed += carState.accel;
        if (keys['s'] || keys['arrowdown']) carState.speed -= carState.accel;

        // Friction & top speed
        carState.speed *= carState.friction;
        carState.speed = THREE.MathUtils.clamp(carState.speed, -carState.maxSpeed / 2, carState.maxSpeed);

        // Steering
        const moveDir = carState.speed >= 0 ? 1 : -1;
        if (keys['a'] || keys['arrowleft']) carState.angle += carState.turnSpeed * moveDir;
        if (keys['d'] || keys['arrowright']) carState.angle -= carState.turnSpeed * moveDir;

        carGroup.rotation.y = carState.angle;

        // Update positions
        carGroup.position.x += Math.sin(carState.angle) * carState.speed;
        carGroup.position.z += Math.cos(carState.angle) * carState.speed;

        applyWallCollisions();

        // Checkered Line Crossing Detection (Z = 0)
        if (carGroup.position.x > R_INNER && Math.abs(carGroup.position.z) < 3) {
          if (!carState.crossedLine) {
            if (carState.lap < carState.maxLaps) {
              carState.lap += 1;
            }
            carState.crossedLine = true;
          }
        } else if (Math.abs(carGroup.position.z) > 8) {
          carState.crossedLine = false;
        }

        // Camera Follow
        const camOffset = new THREE.Vector3(0, 6, -14).applyAxisAngle(new THREE.Vector3(0, 1, 0), carState.angle);
        camera.position.lerp(carGroup.position.clone().add(camOffset), 0.1);
        camera.lookAt(carGroup.position.clone().add(new THREE.Vector3(0, 1, 0)));

        // HUD Updates
        document.getElementById('lapHud').innerText = `LAP: ${carState.lap} / ${carState.maxLaps}`;
        document.getElementById('speedHud').innerText = `SPEED: ${Math.round(Math.abs(carState.speed) * 140)} KM/H`;
      } else {
        // Menu preview rotation
        camera.position.set(0, 120, 180);
        camera.lookAt(0, 0, 0);
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
