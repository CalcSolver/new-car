<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Racing - Host, Join & Track Editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Press Start 2P', monospace; }

        /* Fullscreen Canvas */
        canvas { width: 100vw; height: 100vh; display: block; }

        /* General Overlay Base */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 15, 25, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            color: #fff;
            z-index: 10;
        }

        .title { font-size: 22px; color: #ffaa00; text-shadow: 3px 3px #ff0055; text-align: center; margin-bottom: 10px; }

        input, select {
            padding: 10px 15px;
            font-family: inherit;
            font-size: 11px;
            border: 2px solid #ffaa00;
            background: #111;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            width: 250px;
        }

        .btn {
            padding: 12px 20px;
            font-family: inherit;
            font-size: 11px;
            background: #ff9900;
            color: #fff;
            border: 2px solid #fff;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 0 #994400;
            width: 250px;
            text-align: center;
        }

        .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #994400; }
        .btn-green { background: #00cc66; box-shadow: 0 4px 0 #006633; }
        .btn-blue { background: #0088ff; box-shadow: 0 4px 0 #004499; }
        .btn-purple { background: #aa00ff; box-shadow: 0 4px 0 #550099; }

        /* HUD Card */
        #hud {
            position: absolute;
            top: 20px; right: 20px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #ffaa00;
            border-radius: 8px;
            padding: 15px;
            color: #fff;
            font-size: 10px;
            display: none;
            flex-direction: column;
            gap: 8px;
            z-index: 5;
        }

        /* Editor Controls Box */
        #editor-ui {
            position: absolute;
            bottom: 20px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            border: 2px solid #aa00ff;
            border-radius: 8px;
            padding: 12px;
            display: none;
            gap: 10px;
            z-index: 5;
        }
    </style>
</head>
<body>

    <!-- Main Menu -->
    <div id="main-menu" class="overlay">
        <div class="title">3D RACER PRO</div>
        <input id="playerName" type="text" placeholder="Driver Name" value="Racer1" maxlength="12" />
        <button class="btn btn-green" onclick="showHostMenu()">HOST GAME</button>
        <button class="btn btn-blue" onclick="showJoinMenu()">JOIN GAME</button>
        <button class="btn btn-purple" onclick="openTrackEditor()">TRACK EDITOR</button>
    </div>

    <!-- Host Screen -->
    <div id="host-menu" class="overlay" style="display: none;">
        <div class="title">HOST A ROOM</div>
        <label style="font-size: 10px;">Select Track:</label>
        <select id="track-select">
            <option value="oval">Speedway Oval</option>
            <option value="twisty">Twisty Circuit</option>
            <option value="custom">Custom Saved Track</option>
        </select>
        <button class="btn btn-green" onclick="startRace('host')">START LOBBY</button>
        <button class="btn" onclick="showMainMenu()">BACK</button>
    </div>

    <!-- Join Screen -->
    <div id="join-menu" class="overlay" style="display: none;">
        <div class="title">JOIN ROOM</div>
        <input id="roomCode" type="text" placeholder="Enter Room Code" maxlength="6" />
        <button class="btn btn-blue" onclick="startRace('join')">CONNECT</button>
        <button class="btn" onclick="showMainMenu()">BACK</button>
    </div>

    <!-- In-Game HUD -->
    <div id="hud">
        <div>🏁 LAP: <span id="hud-lap" style="color:#00ffcc">1</span> / 3</div>
        <div>🔥 NITRO: <span id="hud-nitro" style="color:#ff4400">3</span></div>
        <div style="font-size: 8px; color: #aaa; margin-top: 4px;">[SPACE] BOOST | [WASD] DRIVE</div>
    </div>

    <!-- Track Editor Toolbar -->
    <div id="editor-ui">
        <button class="btn btn-purple" style="width: auto;" onclick="addEditorPoint()">+ Add Point</button>
        <button class="btn btn-green" style="width: auto;" onclick="saveCustomTrack()">Save Track</button>
        <button class="btn" style="width: auto;" onclick="exitEditor()">Exit Editor</button>
    </div>

    <script>
        // Track Definitions (X, Z point paths)
        const PRESET_TRACKS = {
            oval: [
                {x: -40, z: -80}, {x: 40, z: -80}, {x: 80, z: -40}, 
                {x: 80, z: 40}, {x: 40, z: 80}, {x: -40, z: 80}, 
                {x: -80, z: 40}, {x: -80, z: -40}
            ],
            twisty: [
                {x: -60, z: -60}, {x: 0, z: -80}, {x: 60, z: -60},
                {x: 20, z: 0}, {x: 80, z: 60}, {x: -20, z: 80},
                {x: -80, z: 20}, {x: -40, z: -20}
            ]
        };

        let currentTrackPoints = [];
        let customTrackPoints = JSON.parse(localStorage.getItem("customTrack")) || PRESET_TRACKS.oval;

        // UI Flow Navigation
        function hideAllOverlays() {
            document.getElementById("main-menu").style.display = "none";
            document.getElementById("host-menu").style.display = "none";
            document.getElementById("join-menu").style.display = "none";
            document.getElementById("hud").style.display = "none";
            document.getElementById("editor-ui").style.display = "none";
        }

        function showMainMenu() { hideAllOverlays(); document.getElementById("main-menu").style.display = "flex"; }
        function showHostMenu() { hideAllOverlays(); document.getElementById("host-menu").style.display = "flex"; }
        function showJoinMenu() { hideAllOverlays(); document.getElementById("join-menu").style.display = "flex"; }

        // Game / Engine Setup
        let scene, camera, renderer, car;
        let speed = 0, rot = 0;
        let keys = {};
        let isEditor = false;

        function initEngine() {
            if (renderer) return; // Prevent duplicate canvases

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Lighting
            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            let dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(50, 100, 50);
            scene.add(dirLight);

            // Grass Ground
            let ground = new THREE.Mesh(
                new THREE.PlaneGeometry(500, 500),
                new THREE.MeshLambertMaterial({ color: 0x2e8b57 })
            );
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            // Create Player Car Mesh
            car = new THREE.Group();
            let body = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.6, 2.6), new THREE.MeshLambertMaterial({ color: 0xff0055 }));
            body.position.y = 0.3;
            car.add(body);
            scene.add(car);

            // Key Controls
            window.addEventListener('keydown', e => keys[e.key] = true);
            window.addEventListener('keyup', e => keys[e.key] = false);

            animate();
        }

        // Draw 3D Asphalt Track Mesh from Points
        let trackMesh = null;
        function generateTrackMesh(points) {
            if (trackMesh) scene.remove(trackMesh);

            let curvePoints = points.map(p => new THREE.Vector3(p.x, 0.1, p.z));
            let curve = new THREE.CatmullRomCurve3(curvePoints, true);
            
            // Build Flat Track Ribbon
            let geometry = new THREE.TubeGeometry(curve, 100, 6, 8, true);
            let material = new THREE.MeshLambertMaterial({ color: 0x333333 });
            
            trackMesh = new THREE.Mesh(geometry, material);
            trackMesh.scale.y = 0.05; // Flatten into road
            scene.add(trackMesh);
        }

        // Start Gameplay Loop
        function startRace(mode) {
            initEngine();
            hideAllOverlays();
            document.getElementById("hud").style.display = "flex";
            isEditor = false;

            // Load Chosen Track
            let selected = document.getElementById("track-select").value;
            currentTrackPoints = (selected === "custom") ? customTrackPoints : PRESET_TRACKS[selected] || PRESET_TRACKS.oval;
            
            generateTrackMesh(currentTrackPoints);

            // Reset Car to Track Start Point
            car.position.set(currentTrackPoints[0].x, 0, currentTrackPoints[0].z);
            rot = 0; speed = 0;
        }

        // Track Editor Mode
        let editorMarkers = [];
        function openTrackEditor() {
            initEngine();
            hideAllOverlays();
            document.getElementById("editor-ui").style.display = "flex";
            isEditor = true;

            currentTrackPoints = [...customTrackPoints];
            renderEditorState();
        }

        function renderEditorState() {
            // Remove old visual markers
            editorMarkers.forEach(m => scene.remove(m));
            editorMarkers = [];

            // Add Red Marker Cylinders at Control Points
            currentTrackPoints.forEach(p => {
                let marker = new THREE.Mesh(
                    new THREE.CylinderGeometry(1.5, 1.5, 3),
                    new THREE.MeshBasicMaterial({ color: 0xffaa00 })
                );
                marker.position.set(p.x, 1.5, p.z);
                scene.add(marker);
                editorMarkers.push(marker);
            });

            generateTrackMesh(currentTrackPoints);
        }

        function addEditorPoint() {
            // Drop a new track node ahead of the car position
            let newX = car.position.x + Math.sin(rot) * 15;
            let newZ = car.position.z + Math.cos(rot) * 15;
            currentTrackPoints.push({ x: newX, z: newZ });
            renderEditorState();
        }

        function saveCustomTrack() {
            customTrackPoints = [...currentTrackPoints];
            localStorage.setItem("customTrack", JSON.stringify(customTrackPoints));
            alert("Custom Track Saved!");
        }

        function exitEditor() {
            editorMarkers.forEach(m => scene.remove(m));
            showMainMenu();
        }

        // Physics & Render Loop
        function animate() {
            requestAnimationFrame(animate);

            // Driving Mechanics
            if (keys['w'] || keys['ArrowUp']) speed = Math.min(speed + 0.03, 1.2);
            else if (keys['s'] || keys['ArrowDown']) speed = Math.max(speed - 0.03, -0.4);
            else speed *= 0.98;

            if (keys['a'] || keys['ArrowLeft']) rot += 0.04;
            if (keys['d'] || keys['ArrowRight']) rot -= 0.04;

            car.position.x += Math.sin(rot) * speed;
            car.position.z += Math.cos(rot) * speed;
            car.rotation.y = rot;

            // Camera Following Car
            camera.position.x = car.position.x - Math.sin(rot) * 12;
            camera.position.z = car.position.z - Math.cos(rot) * 12;
            camera.position.y = car.position.y + 7;
            camera.lookAt(car.position.x, car.position.y + 0.5, car.position.z);

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
