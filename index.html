<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Racing Game - Fresh Base</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <!-- Three.js Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Press Start 2P', monospace; }

        /* Fullscreen Canvas */
        #gameCanvas { width: 100vw; height: 100vh; display: block; }

        /* Front Menu Overlay */
        #menu-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 15, 25, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            color: #fff;
            z-index: 10;
        }

        .title { font-size: 24px; color: #ffaa00; text-shadow: 3px 3px #ff0055; text-align: center; }

        input {
            padding: 10px;
            font-family: inherit;
            font-size: 14px;
            border: 2px solid #ffaa00;
            background: #111;
            color: #fff;
            text-align: center;
            border-radius: 6px;
        }

        .btn {
            padding: 12px 24px;
            font-family: inherit;
            font-size: 12px;
            background: #ff9900;
            color: #fff;
            border: 2px solid #fff;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 0 #994400;
        }

        .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #994400; }

        /* Floating HUD */
        #hud {
            position: absolute;
            top: 20px; right: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #ffaa00;
            border-radius: 8px;
            padding: 15px;
            color: #fff;
            font-size: 10px;
            display: none;
            flex-direction: column;
            gap: 10px;
            z-index: 5;
        }
    </style>
</head>
<body>

    <!-- Main Front Menu -->
    <div id="menu-overlay">
        <div class="title">RACING GAME</div>
        <input id="playerName" type="text" placeholder="Enter Name" maxlength="12" />
        <button class="btn" onclick="buyNitro()">🛒 Buy Nitro (50 Coins)</button>
        <button class="btn" style="background:#00cc66; box-shadow:0 4px 0 #006633;" onclick="startGame()">START RACE</button>
    </div>

    <!-- HUD Card -->
    <div id="hud">
        <div>🪙 COINS: <span id="hud-coins" style="color:#ffcc00">0</span></div>
        <div>🔥 NITRO: <span id="hud-nitro" style="color:#ff4400">3</span></div>
        <div>🏁 LAP: <span id="hud-lap" style="color:#00ffcc">1</span> / 5</div>
        <div style="font-size: 8px; color: #aaa; margin-top: 4px;">[SPACE] TO NITRO BOOST</div>
    </div>

    <script>
        // Data & Save
        let coins = parseInt(localStorage.getItem("racingCoins")) || 0;
        let nitroCount = parseInt(localStorage.getItem("nitroCount")) || 3;
        let isNitroActive = false;

        function updateHUD() {
            document.getElementById("hud-coins").innerText = coins;
            document.getElementById("hud-nitro").innerText = nitroCount;
        }

        function buyNitro() {
            if (coins >= 50) {
                coins -= 50; nitroCount++;
                localStorage.setItem("racingCoins", coins);
                localStorage.setItem("nitroCount", nitroCount);
                updateHUD();
                alert("Bought 1 Nitro!");
            } else {
                alert("Need 50 coins!");
            }
        }

        // Scene Setup
        let scene, camera, renderer, car, flameGroup;
        let speed = 0, rot = 0;
        let keys = {};

        function startGame() {
            document.getElementById("menu-overlay").style.display = "none";
            document.getElementById("hud").style.display = "flex";
            updateHUD();

            // Init Three.js
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Lighting
            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            let dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(50, 100, 50);
            scene.add(dirLight);

            // Track Ground
            let ground = new THREE.Mesh(
                new THREE.PlaneGeometry(500, 500),
                new THREE.MeshLambertMaterial({ color: 0x2e8b57 })
            );
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            // Create Car
            car = new THREE.Group();
            let body = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.6, 2.6), new THREE.MeshLambertMaterial({ color: 0xff0055 }));
            body.position.y = 0.3;
            car.add(body);
            scene.add(car);

            // Controls
            window.addEventListener('keydown', e => {
                keys[e.key] = true;
                if (e.code === 'Space') useNitro();
            });
            window.addEventListener('keyup', e => keys[e.key] = false);

            animate();
        }

        function useNitro() {
            if (nitroCount > 0 && !isNitroActive) {
                nitroCount--;
                isNitroActive = true;
                localStorage.setItem("nitroCount", nitroCount);
                updateHUD();
                setTimeout(() => { isNitroActive = false; }, 2500);
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            let maxSpeed = isNitroActive ? 2.2 : 1.0;
            if (keys['w'] || keys['ArrowUp']) speed = Math.min(speed + 0.03, maxSpeed);
            else if (keys['s'] || keys['ArrowDown']) speed = Math.max(speed - 0.03, -0.4);
            else speed *= 0.98;

            if (keys['a'] || keys['ArrowLeft']) rot += 0.04;
            if (keys['d'] || keys['ArrowRight']) rot -= 0.04;

            car.position.x += Math.sin(rot) * speed;
            car.position.z += Math.cos(rot) * speed;
            car.rotation.y = rot;

            camera.position.x = car.position.x - Math.sin(rot) * 7;
            camera.position.z = car.position.z - Math.cos(rot) * 7;
            camera.position.y = car.position.y + 3.5;
            camera.lookAt(car.position.x, car.position.y + 0.8, car.position.z);

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
