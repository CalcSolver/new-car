<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Racing Game</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
      font-family: sans-serif;
      color: #fff;
    }
    #ui {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 10;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    input, button {
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 4px;
      border: none;
    }
    input { background: #222; color: #fff; border: 1px solid #444; }
    button { background: #28a745; color: #fff; cursor: pointer; font-weight: bold; }
    .hud-box {
      background: rgba(0,0,0,0.7);
      padding: 8px 14px;
      border-radius: 4px;
      font-weight: bold;
      border: 1px solid #333;
    }
    #canvas3d {
      width: 100vw;
      height: 100vh;
      display: block;
    }
  </style>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui">
    <input type="text" id="roomInput" placeholder="Room Code" value="ROOM1">
    <button id="joinBtn">Join Room</button>
    <div class="hud-box" id="lapHud">Lap: 0 / 3</div>
    <div class="hud-box" id="speedHud">Speed: 0 km/h</div>
  </div>

  <canvas id="canvas3d"></canvas>

  <script>
    // --- SCENE SETUP ---
    const canvas = document.getElementById('canvas3d');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb); // Sky blue
    scene.fog = new THREE.Fog(0x87ceeb, 50, 250);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(100, 150, 50);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // --- TRACK & WALL BOUNDARIES ---
    // Oval track radius and width
    const R_OUTER = 60;
    const R_INNER = 35;
    const TRACK_CENTER_R = (R_OUTER + R_INNER) / 2;

    // Grass ground
    const groundGeo = new THREE.PlaneGeometry(300, 300);
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x2e8b57 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // Track Surface (Ring)
    const trackGeo = new THREE.RingGeometry(R_INNER, R_OUTER, 64);
    const trackMat = new THREE.MeshLambertMaterial({ color: 0x333333, side: THREE.DoubleSide });
    const trackMesh = new THREE.Mesh(trackGeo, trackMat);
    trackMesh.rotation.x = -Math.PI / 2;
    trackMesh.position.y = 0.01;
    scene.add(trackMesh);

    // --- CHECKERED START / FINISH LINE ---
    function createCheckeredStartLine() {
      const lineGroup = new THREE.Group();
      const rows = 2;
      const cols = 10;
      const size = (R_OUTER - R_INNER) / cols;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const isWhite = (r + c) % 2 === 0;
          const mat = new THREE.MeshBasicMaterial({ color: isWhite ? 0xffffff : 0x000000 });
          const geo = new THREE.PlaneGeometry(size, 2);
          const tile = new THREE.Mesh(geo, mat);
          tile.rotation.x = -Math.PI / 2;
          tile.position.set(R_INNER + (c * size) + (size / 2), 0.02, (r * 2) - 1);
          lineGroup.add(tile);
        }
      }
      return lineGroup;
    }
    scene.add(createCheckeredStartLine());

    // --- CAR CREATION ---
    const carGroup = new THREE.Group();
    
    // Chassis
    const bodyGeo = new THREE.BoxGeometry(2, 0.8, 4);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0xe74c3c });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 0.6;
    carGroup.add(body);

    // Cabin
    const cabinGeo = new THREE.BoxGeometry(1.6, 0.6, 2);
    const cabinMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
    const cabin = new THREE.Mesh(cabinGeo, cabinMat);
    cabin.position.set(0, 1.2, -0.3);
    carGroup.add(cabin);

    scene.add(carGroup);
    carGroup.position.set((R_OUTER + R_INNER) / 2, 0, 5);

    // --- CAR PHYSICS & STATE ---
    const carState = {
      speed: 0,
      maxSpeed: 0.8,
      accel: 0.02,
      friction: 0.96,
      turnSpeed: 0.03,
      angle: 0,
      lap: 0,
      crossedLine: false
    };

    const keys = {};
    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    // Join Button UI Setup
    document.getElementById('joinBtn').addEventListener('click', () => {
      const btn = document.getElementById('joinBtn');
      const code = document.getElementById('roomInput').value.trim().toUpperCase();
      if(code) {
        btn.innerText = 'Connected: ' + code;
        btn.style.background = '#007bff';
      }
    });

    // --- WALL COLLISION FIX (SLIDING PHYSICS) ---
    function handleWallCollisions() {
      // Calculate distance from center of circular track (0,0)
      const distFromCenter = Math.hypot(carGroup.position.x, carGroup.position.z);
      const carRadius = 1.2; // Collision padding around car

      // 1. Outer Wall Collision
      if (distFromCenter + carRadius > R_OUTER) {
        const angle = Math.atan2(carGroup.position.z, carGroup.position.x);
        carGroup.position.x = Math.cos(angle) * (R_OUTER - carRadius);
        carGroup.position.z = Math.sin(angle) * (R_OUTER - carRadius);
        carState.speed *= 0.7; // Dampen speed on impact instead of sticking
      }

      // 2. Inner Wall Collision
      if (distFromCenter - carRadius < R_INNER) {
        const angle = Math.atan2(carGroup.position.z, carGroup.position.x);
        carGroup.position.x = Math.cos(angle) * (R_INNER + carRadius);
        carGroup.position.z = Math.sin(angle) * (R_INNER + carRadius);
        carState.speed *= 0.7;
      }
    }

    // --- GAME LOOP ---
    function animate() {
      requestAnimationFrame(animate);

      // Controls & Acceleration
      if (keys['w'] || keys['arrowup']) carState.speed += carState.accel;
      if (keys['s'] || keys['arrowdown']) carState.speed -= carState.accel;

      // Friction & Cap Speed
      carState.speed *= carState.friction;
      carState.speed = THREE.MathUtils.clamp(carState.speed, -carState.maxSpeed / 2, carState.maxSpeed);

      // Steering
      const moveDir = carState.speed >= 0 ? 1 : -1;
      if (keys['a'] || keys['arrowleft']) carState.angle += carState.turnSpeed * moveDir;
      if (keys['d'] || keys['arrowright']) carState.angle -= carState.turnSpeed * moveDir;

      carGroup.rotation.y = carState.angle;

      // Movement Vector
      carGroup.position.x += Math.sin(carState.angle) * carState.speed;
      carGroup.position.z += Math.cos(carState.angle) * carState.speed;

      // Apply Fixed Wall Collisions
      handleWallCollisions();

      // Lap Detection (Crossing Z = 0 line while on right side of track)
      if (carGroup.position.x > R_INNER && Math.abs(carGroup.position.z) < 2) {
        if (!carState.crossedLine) {
          carState.lap += 1;
          carState.crossedLine = true;
        }
      } else if (Math.abs(carGroup.position.z) > 5) {
        carState.crossedLine = false;
      }

      // Smooth Camera Follow
      const camOffset = new THREE.Vector3(0, 5, -12).applyAxisAngle(new THREE.Vector3(0, 1, 0), carState.angle);
      camera.position.lerp(carGroup.position.clone().add(camOffset), 0.1);
      camera.lookAt(carGroup.position.clone().add(new THREE.Vector3(0, 1, 0)));

      // UI Updates
      document.getElementById('lapHud').innerText = `Lap: ${carState.lap} / 3`;
      document.getElementById('speedHud').innerText = `Speed: ${Math.round(Math.abs(carState.speed) * 120)} km/h`;

      renderer.render(scene, camera);
    }

    // Window Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
